<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SetTrace · 当前 UI 参考</title>
<style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#19262c;background:#f5f7f8;--accent:#087f6b}*{box-sizing:border-box}body{margin:0}header{padding:42px max(24px,5vw) 28px;background:#fff;border-bottom:1px solid #dbe3e5}header small{letter-spacing:.13em;color:var(--accent);font-weight:700}h1{font-size:clamp(28px,4vw,44px);margin:10px 0 12px}p{line-height:1.7}header p{max-width:880px;color:#586970}a{color:#076d5c;text-underline-offset:3px}nav{display:flex;gap:20px;flex-wrap:wrap}.facts{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.fact{padding:9px 14px;border-radius:8px;background:#eef2f3;font-variant-numeric:tabular-nums}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:24px max(24px,5vw);background:#f5f7f8}label{font-size:14px;display:grid;gap:7px}input,select,button{font:inherit;min-height:44px;padding:10px 12px;border:1px solid #71858c;border-radius:8px;background:#fff;color:#19262c}input{min-width:230px}button{cursor:pointer}button:hover{border-color:var(--accent);background:#e2f2ed}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #087f6b;outline-offset:3px}main{padding:0 max(24px,5vw) 48px}.status{margin:0 0 20px;color:#586970}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:22px}.card{border:1px solid #dbe3e5;border-radius:16px;overflow:hidden;background:#fff}.image{display:block;width:100%;height:370px;background:#e8edef;border:0;border-radius:0;padding:14px}.image img{max-width:100%;height:100%;object-fit:contain;display:block;margin:auto}.info{padding:18px}.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:5px;padding:4px 7px;background:#e2f2ed;color:#076d5c}.badge.test{background:#fff1d8;color:#855208}.info h2{font-size:17px;overflow-wrap:anywhere;margin:10px 0}.meta{font-size:13px;color:#586970;line-height:1.65;overflow-wrap:anywhere}.info a{display:inline-block;margin-top:12px}dialog{max-width:min(1100px,96vw);max-height:96dvh;border:1px solid #71858c;border-radius:16px;padding:18px;background:#fff}dialog::backdrop{background:#111518bc}.viewer{display:flex;gap:22px;align-items:flex-start}.viewer img{height:80dvh;max-width:65vw;object-fit:contain}.viewer aside{max-width:300px;overflow-wrap:anywhere}.close{float:right;margin-bottom:12px}footer{padding:30px max(24px,5vw);border-top:1px solid #dbe3e5;color:#586970;font-size:14px}@media(max-width:680px){header{padding-top:28px}.viewer{display:block}.viewer img{max-width:85vw;height:65dvh}.filters>label{flex:1}.image{height:410px}}
</style>
<header><small>SETTRACE / UI REFERENCE</small><h1>当前界面，一处参考。</h1><p>基于明确源码与构建整理的页面、弹窗和状态。Android release 原帧与受控测试渲染分别标识；图像采集不代表全部功能或所有设备验收通过。</p><div class="facts" id="facts"></div><nav><a href="README.md">阅读说明</a><a href="screen-inventory.md">完整状态目录</a><a href="verification/build.json">构建身份</a><a href="verification/coverage.md">覆盖与待验</a><a href="specs/visual-and-components.md">设计规范</a><a href="../archive/README.md">历史归档</a></nav></header>
<section class="filters" aria-label="筛选界面"><label>搜索页面或状态<input id="query" type="search" placeholder="例如 W03、备份、preview"></label><label>功能<select id="group"><option value="">全部功能</option></select></label><label>来源<select id="kind"><option value="">全部来源</option><option value="release-emulator">Android release</option><option value="widget-test">测试渲染</option></select></label><label>语言<select id="language"><option value="">全部语言</option><option value="zh">中文</option><option value="en">English</option></select></label><label>外观<select id="theme"><option value="">浅色与深色</option><option value="light">浅色</option><option value="dark">深色</option></select></label></section>
<main><p class="status" id="status" role="status" aria-live="polite"></p><div class="grid" id="grid"></div></main>
<dialog id="viewer" aria-labelledby="detailTitle"><button class="close" id="close">关闭</button><div class="viewer"><img id="detailImage" alt=""><aside><h2 id="detailTitle"></h2><p id="detailMeta"></p><a id="original" target="_blank" rel="noopener">打开原始 PNG</a></aside></div></dialog>
<footer>离线参考资料。缺少截图的分支见完整状态目录；真机听感、触感、TalkBack 与厂商后台条件保持独立验证范围。</footer>
<script id="manifest" type="application/json">__MANIFEST__</script>
<script>
const M=JSON.parse(document.getElementById('manifest').textContent),$=id=>document.getElementById(id),names={plans:'计划与准备',core:'核心测试状态',workout:'训练与休息',history:'记录',settings:'设置',transfer:'计划分享',backup:'备份与恢复',diagnostics:'诊断与日志',about:'关于与许可',adaptation:'适配'};
const kindName=c=>c.state_id==='controlled-view-fixture'||c.screen_id==='L03a'?'受控状态渲染':c.capture_kind==='widget-test'?'测试渲染':'Android release';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('facts').innerHTML=[`应用 ${M.version}`,`源码 ${M.source_commit.slice(0,7)}`,`${M.screens.length} 个页面／状态条目`,`${M.captures.filter(c=>c.capture_kind==='release-emulator').length} 张 release 原帧`,`${M.captures.filter(c=>c.capture_kind==='widget-test').length} 张测试渲染`].map(t=>`<span class="fact">${esc(t)}</span>`).join('');
[...new Set(M.captures.map(c=>c.group))].sort().forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=names[g]||g;$('group').append(o)});
let visible=[];function render(){const q=$('query').value.trim().toLowerCase();visible=M.captures.filter(c=>(!q||`${c.screen_id} ${c.state_id} ${names[c.group]||c.group}`.toLowerCase().includes(q))&&['group','language','theme'].every(k=>!$(k).value||c[k]===$(k).value)&&(!$('kind').value||c.capture_kind===$('kind').value));$('status').textContent=`显示 ${visible.length} / ${M.captures.length} 张。来源标记与实际环境见每张图的详情。`;$('grid').innerHTML=visible.map((c,i)=>`<article class="card"><button class="image" data-i="${i}" aria-label="查看 ${esc(c.screen_id)} ${esc(c.state_id)}"><img loading="lazy" src="${esc(c.path)}" alt="${esc(c.screen_id)}，${esc(c.state_id)}，${c.language==='zh'?'中文':'英文'}${c.theme==='dark'?'深色':'浅色'}"></button><div class="info"><span class="badge ${c.capture_kind==='widget-test'?'test':''}">${kindName(c)}</span><h2>${esc(c.screen_id)} · ${esc(c.state_id)}</h2><div class="meta">${c.language==='zh'?'中文':'English'} · ${c.theme==='dark'?'深色':'浅色'} · ${c.logical_width}dp · 字号 ${c.font_scale}<br>${esc(c.theme_color)} · ${esc(c.orientation)}<br>${esc(names[c.group]||c.group)}</div><a href="${esc(c.path)}">原始 PNG</a></div></article>`).join('');}
['query','group','kind','language','theme'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',render));$('grid').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;const c=visible[+b.dataset.i];$('detailImage').src=c.path;$('detailImage').alt=`${c.screen_id} ${c.state_id}`;$('detailTitle').textContent=`${c.screen_id} · ${c.state_id}`;$('detailMeta').textContent=`${c.capture_kind} / ${c.language} / ${c.theme} / ${c.logical_width} × ${c.logical_height}dp / 字号 ${c.font_scale}\n基线：${c.baseline_id}\nSHA-256：${c.sha256}\n${c.fixture||''}`;$('original').href=c.path;$('viewer').showModal();});$('close').onclick=()=>$('viewer').close();render();
</script></html>
