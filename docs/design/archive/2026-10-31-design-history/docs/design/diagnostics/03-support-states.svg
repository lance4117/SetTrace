<text x="509" y="712" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#586970">你仍可分享现有文件，帮助分析问题。</text>
<text x="509" y="752" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#586970">若需要更完整的线索，可重新复现问题</text>
