<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1138" viewBox="0 0 1360 1138">
<rect width="100%" height="100%" fill="#E9EEEC"/>
<text x="40" y="28" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" dominant-baseline="text-before-edge" fill="#076D5C">SETTRACE  /  诊断与日志</text>
<text x="40" y="56" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" dominant-baseline="text-before-edge" fill="#19262C">需要排查时深入，出现故障时仍有出口</text>
<text x="40" y="99" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#586970">03 / 按需记录、部分导出与启动故障</text>
<text x="40" y="1108" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" dominant-baseline="text-before-edge" fill="#586970">界面草图 · 数值与结果均为设计示例 · 未接入真实日志或文件操作</text>
<text x="40" y="128" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="700" dominant-baseline="text-before-edge" fill="#076D5C">L05</text>
<text x="84" y="124" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" dominant-baseline="text-before-edge" fill="#19262C">临时详细诊断</text>
<text x="40" y="1044" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#586970">独立说明页，开启前清楚交代期限与用途。</text>
<text x="40" y="1068" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#586970">开启后显示结束时刻和“立即关闭”。</text>
