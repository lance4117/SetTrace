<text x="104" y="233" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" dominant-baseline="text-before-edge" fill="#19262C">诊断与日志</text>
<text x="64" y="295" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" dominant-baseline="text-before-edge" fill="#19262C">临时详细诊断</text>
<text x="64" y="340" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" fill="#19262C">复现问题时，临时记录更多技术细节。</text>
<rect x="64" y="392" width="342" height="96" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="80" y="411" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#586970">当前状态</text>
<text x="80" y="445" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" dominant-baseline="text-before-edge" fill="#19262C">未开启</text>
<rect x="64" y="515" width="342" height="153" rx="16" fill="#E2F2ED" stroke="none" stroke-width="1"/>
<text x="80" y="535" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" dominant-baseline="text-before-edge" fill="#076D5C">开启后</text>
<text x="80" y="574" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#076D5C">30分钟后自动关闭，重启也会关闭。</text>
<text x="80" y="605" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#076D5C">不会自动上传，也不会记录输入内容。</text>
<text x="80" y="636" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#076D5C">记录量会增加，仍受保存上限限制。</text>
<text x="64" y="702" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" dominant-baseline="text-before-edge" fill="#19262C">建议的排查步骤</text>
<text x="64" y="745" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" fill="#19262C">1. 开启详细诊断</text>
<text x="64" y="785" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" fill="#19262C">2. 返回训练，重新操作一次</text>
<text x="64" y="825" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" fill="#19262C">3. 回到这里，导出诊断包</text>
<rect x="41" y="889" width="388" height="107" rx="0" fill="#F5F7F8" stroke="none" stroke-width="1"/>
<polyline points="64,889 406,889" fill="none" stroke="#DBE3E5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="64" y="905" width="342" height="56" rx="14" fill="#087F6B" stroke="none" stroke-width="1"/>
<text x="193.0" y="922" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" dominant-baseline="text-before-edge" fill="#FFFFFF">开启30分钟</text>
<text x="64" y="973" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" dominant-baseline="text-before-edge" fill="#586970">只在排查问题时使用。</text>
<text x="485" y="128" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="700" dominant-baseline="text-before-edge" fill="#076D5C">L06</text>
<text x="529" y="124" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" dominant-baseline="text-before-edge" fill="#19262C">部分信息不可用</text>
<text x="485" y="1044" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#586970">黄色说明诊断信息有缺失，文件已保存。</text>
<text x="485" y="1068" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" fill="#586970">不与“保存失败”混为一种状态。</text>
